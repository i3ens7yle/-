<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>สั่งอาหาร</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.jpg">
<link rel="apple-touch-icon" href="/icon.jpg">
<style>
  header.top { padding: 20px 16px 14px; text-align: center; }
  header.top .logo { width: 150px; height: 150px; border-radius: 50%; display: block; margin: 0 auto 8px; box-shadow: 0 6px 24px rgba(0,0,0,.18); background: #fff; }
  header.top h1 { margin: 0; font-size: 24px; line-height: 1.25; }
  header.top .tagline { color: var(--muted); margin: 2px 0 10px; }
  .table-pill { display: inline-block; background: var(--accent); color: var(--accent-ink); font-weight: 700; font-size: 18px; padding: 6px 18px; border-radius: 999px; white-space: nowrap; }
  nav.cats {
    position: sticky; top: 0; z-index: 10; background: var(--bg);
    display: flex; gap: 8px; overflow-x: auto; padding: 8px 16px 10px;
    border-bottom: 1px solid var(--line); scrollbar-width: none;
  }
  nav.cats::-webkit-scrollbar { display: none; }
  nav.cats button { flex: none; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 600; min-height: 40px; }
  nav.cats button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  main { padding: 4px 16px 180px; max-width: 640px; margin: 0 auto; }
  section h3 { margin: 22px 0 8px; font-size: 17px; color: var(--muted); }
  .item {
    display: flex; align-items: center; gap: 12px;
    background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow);
    padding: 12px 12px 12px 16px; margin-bottom: 10px; min-height: 68px;
  }
  .item .info { flex: 1; min-width: 0; }
  .item .name { font-weight: 600; font-size: 17px; }
  .item .desc { color: var(--muted); font-size: 14px; }
  .item .price { font-weight: 700; color: var(--accent); }
  .item.sold { opacity: 0.55; }
  .qty { display: flex; align-items: center; gap: 4px; }
  .qty button {
    width: 42px; height: 42px; border-radius: 50%; border: 0; font-size: 22px; font-weight: 700; line-height: 1;
    background: var(--accent); color: var(--accent-ink);
  }
  .qty button.minus { background: var(--accent-soft); color: var(--accent); }
  .qty span { min-width: 26px; text-align: center; font-weight: 700; font-size: 17px; }
  .sold-tag { color: var(--bad); font-weight: 700; padding: 0 8px; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--bg); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
  }
  .bar-inner { max-width: 640px; margin: 0 auto; display: grid; gap: 8px; }
  .bar .row { display: grid; grid-template-columns: 1fr 1fr 1fr; gap: 8px; }
  .bar .row .btn { padding: 8px 6px; font-size: 14px; min-height: 44px; }
  .cart-btn { display: flex; justify-content: space-between; align-items: center; font-size: 17px; }

  .line { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .line .info { flex: 1; min-width: 0; }
  .line .sub { color: var(--muted); font-size: 14px; }
  .total-row { display: flex; justify-content: space-between; font-size: 20px; font-weight: 700; padding: 14px 0; }
  .sum-box { background: var(--card); border-radius: var(--radius); padding: 10px 14px; margin-top: 12px; box-shadow: var(--shadow); }
  .sum-box .r { display: flex; justify-content: space-between; padding: 4px 0; color: var(--muted); }
  .sum-box .r.pay { color: var(--ink); font-size: 22px; font-weight: 700; border-top: 1px solid var(--line); margin-top: 6px; padding-top: 10px; }
  .sum-box .r.after { color: var(--ink); font-weight: 600; }
  .vat-note { color: var(--muted); font-size: 14px; text-align: center; margin: 10px 0 0; }
  textarea { width: 100%; border: 1px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 12px; min-height: 64px; resize: vertical; }
  .order-card { background: var(--card); border-radius: var(--radius); padding: 12px 14px; margin-bottom: 10px; box-shadow: var(--shadow); }
  .order-card .head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 6px; color: var(--muted); font-size: 14px; }
  .order-card .it { display: flex; justify-content: space-between; gap: 8px; }
  .done-tag { color: var(--good); font-weight: 600; font-size: 14px; white-space: nowrap; }
  .order-card.cancelled .it { text-decoration: line-through; color: var(--muted); }
  .note { color: var(--muted); font-size: 14px; margin-top: 4px; }
  .empty { text-align: center; color: var(--muted); padding: 24px 0; }
  .blocker { max-width: 420px; margin: 18vh auto 0; padding: 24px; text-align: center; }
  .blocker .big { font-size: 56px; }
  .closed-note { max-width: 640px; margin: 12px auto 0; background: var(--warn-soft); color: var(--warn); border-radius: 14px; padding: 12px 14px; font-weight: 600; text-align: center; }
  .call-state { text-align: center; background: var(--warn-soft); color: var(--warn); border-radius: 12px; padding: 8px; font-weight: 600; }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>

<div class="sheet-bg" id="cartSheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="cartTitle">
  <h2><span id="cartTitle">ตะกร้าของโต๊ะ <span class="tno"></span></span><button class="close" data-close aria-label="ปิด">×</button></h2>
  <div id="cartLines"></div>
  <label for="note" style="display:block;margin:14px 0 6px;font-weight:600">หมายเหตุถึงครัว (ถ้ามี)</label>
  <textarea id="note" maxlength="200" placeholder="เช่น ไม่ใส่ผักชี, เผ็ดน้อย"></textarea>
  <div class="sum-box" id="cartSum"></div>
  <div style="height:12px"></div>
  <button class="btn btn-primary" id="submitOrder" style="width:100%;font-size:18px">ยืนยันสั่งอาหาร</button>
</div></div>

<div class="sheet-bg" id="ordersSheet"><div class="sheet" role="dialog" aria-modal="true" aria-labelledby="ordersTitle">
  <h2><span id="ordersTitle">รายการที่สั่งแล้ว · โต๊ะ <span class="tno"></span></span><button class="close" data-close aria-label="ปิด">×</button></h2>
  <div id="ordersList"></div>
  <div class="sum-box" id="ordersSum"></div>
</div></div>

<script>
const params = new URLSearchParams(location.search);
const TABLE = Number(params.get("table"));
const KEY = params.get("k") || "";
const CART_KEY = "cart-" + TABLE + "-" + KEY;
const baht = (n) => "฿" + (Number.isInteger(Number(n)) ? Number(n).toLocaleString("th-TH") : Number(n).toLocaleString("th-TH", { minimumFractionDigits: 2, maximumFractionDigits: 2 }));
// ต้องคำนวณแบบเดียวกับฝั่งร้าน (server.js: billFor)
function billFor(subtotal) {
  const p = (MENU && MENU.vatPercent) || 0;
  const vat = Math.round(((subtotal * p) / 100) * 100) / 100;
  return { subtotal, vatPercent: p, vat, total: Math.round((subtotal + vat) * 100) / 100 };
}
function sumRows(b, payLabel) {
  return (b.vatPercent ? `<div class="r"><span>ค่าอาหารและเครื่องดื่ม</span><span class="price">${baht(b.subtotal)}</span></div>
    <div class="r"><span>VAT ${b.vatPercent}%</span><span class="price">${baht(b.vat)}</span></div>` : "") +
    `<div class="r pay"><span>${payLabel}</span><span class="price">${baht(b.total)}</span></div>`;
}
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const STATUS = { new: "รอร้านรับ", cooking: "กำลังทำ", served: "เสิร์ฟแล้ว", cancelled: "ยกเลิก" };

let MENU = null, TABLE_STATE = { open: true, orders: [], total: 0, call: null };
let cart = {};
try { cart = JSON.parse(localStorage.getItem(CART_KEY) || "{}") || {}; } catch {}
const saveCart = () => { try { localStorage.setItem(CART_KEY, JSON.stringify(cart)); } catch {} };

function toast(msg) {
  const t = document.getElementById("toast");
  t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}
async function api(path, body) {
  const r = await fetch(path, body ? { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) } : {});
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || "เกิดข้อผิดพลาด ลองใหม่อีกครั้ง");
  return data;
}
function blocker(icon, title, text) {
  document.getElementById("app").innerHTML =
    `<div class="blocker"><div class="big">${icon}</div><h2>${esc(title)}</h2><p style="color:var(--muted)">${esc(text)}</p></div>`;
}

function cartCount() { return Object.values(cart).reduce((s, q) => s + q, 0); }
function cartTotal() {
  return Object.entries(cart).reduce((s, [id, q]) => {
    const it = MENU.items.find((i) => i.id === id); return s + (it ? it.price * q : 0);
  }, 0);
}
function setQty(id, q) {
  if (q <= 0) delete cart[id]; else cart[id] = Math.min(99, q);
  saveCart(); render(); renderCart();
}

function render() {
  const app = document.getElementById("app");
  const sold = new Set(MENU.items.filter((i) => i.soldOut).map((i) => i.id));
  // เอาของที่หมดออกจากตะกร้า
  for (const id of Object.keys(cart)) if (sold.has(id) || !MENU.items.some((i) => i.id === id)) delete cart[id];

  const sections = MENU.categories.map((c) => {
    const items = MENU.items.filter((i) => i.cat === c.id);
    if (!items.length) return "";
    return `<section id="cat-${esc(c.id)}"><h3>${esc(c.name)}</h3>${items.map((i) => {
      const q = cart[i.id] || 0;
      const ctrl = i.soldOut ? `<span class="sold-tag">หมด</span>`
        : q ? `<div class="qty"><button class="minus" data-id="${esc(i.id)}" data-d="-1" aria-label="ลด ${esc(i.name)}">−</button><span>${q}</span><button data-id="${esc(i.id)}" data-d="1" aria-label="เพิ่ม ${esc(i.name)}">+</button></div>`
        : `<div class="qty"><button data-id="${esc(i.id)}" data-d="1" aria-label="เพิ่ม ${esc(i.name)}">+</button></div>`;
      return `<div class="item${i.soldOut ? " sold" : ""}"><div class="info"><div class="name">${esc(i.name)}</div>${i.desc ? `<div class="desc">${esc(i.desc)}</div>` : ""}<div class="price">${baht(i.price)}</div></div>${ctrl}</div>`;
    }).join("")}</section>`;
  }).join("");

  const n = cartCount();
  const call = TABLE_STATE.call;
  const scrollY = window.scrollY;
  app.innerHTML = `
    <header class="top">${MENU.logo ? `<img class="logo" src="${esc(MENU.logo)}" alt="โลโก้ร้าน ${esc(MENU.shopName)}" width="150" height="150">` : ""}<h1>${esc(MENU.shopName)}</h1>${MENU.tagline ? `<div class="tagline">${esc(MENU.tagline)}</div>` : ""}<span class="table-pill">โต๊ะ ${TABLE}</span>
      ${TABLE_STATE.movedTo ? `<div class="closed-note">➡️ ย้ายไปโต๊ะ ${Number(TABLE_STATE.movedTo)} แล้วจ้า<br>รายการที่สั่งไว้ย้ายไปด้วยแล้ว กรุณาสแกน QR ที่โต๊ะ ${Number(TABLE_STATE.movedTo)} เพื่อสั่งต่อนะจ๊ะ</div>`
        : TABLE_STATE.open ? "" : `<div class="closed-note">🔒 โต๊ะนี้ยังไม่เปิด<br>ดูเมนูและเลือกใส่ตะกร้าไว้ก่อนได้ แล้วกด "เรียกพนักงาน" ให้มาเปิดโต๊ะนะจ๊ะ</div>`}</header>
    <nav class="cats">${MENU.categories.map((c, ix) => `<button data-cat="${esc(c.id)}"${ix === 0 ? ' class="on"' : ""}>${esc(c.name)}</button>`).join("")}</nav>
    <main>${MENU.vatPercent ? `<p class="vat-note">ราคาในเมนูยังไม่รวม VAT ${MENU.vatPercent}%</p>` : ""}${sections}</main>
    <div class="bar"><div class="bar-inner">
      ${call ? `<div class="call-state">${call.type === "bill" ? "แจ้งขอเช็คบิลแล้ว พนักงานกำลังมา" : "เรียกพนักงานแล้ว กำลังมา"}</div>` : ""}
      ${n ? `<button class="btn btn-primary cart-btn" id="openCart"><span>ดูตะกร้า · ${n} รายการ</span><span class="price">${baht(cartTotal())}</span></button>` : ""}
      <div class="row">
        <button class="btn" id="openOrders">ยอดที่ต้องจ่าย<br><b class="price">${baht((TABLE_STATE.bill || billFor(TABLE_STATE.total)).total)}</b></button>
        <button class="btn" id="callStaff">เรียก<br>พนักงาน</button>
        <button class="btn" id="callBill"${TABLE_STATE.open ? "" : " disabled"}>ขอ<br>เช็คบิล</button>
      </div>
    </div></div>`;
  window.scrollTo(0, scrollY);
}

function renderCart() {
  const lines = Object.entries(cart).map(([id, q]) => {
    const i = MENU.items.find((x) => x.id === id); if (!i) return "";
    return `<div class="line"><div class="info"><div><b>${esc(i.name)}</b></div><div class="sub">${baht(i.price)} × ${q} = <span class="price">${baht(i.price * q)}</span></div></div>
      <div class="qty"><button class="minus" data-id="${esc(id)}" data-d="-1" aria-label="ลด">−</button><span>${q}</span><button data-id="${esc(id)}" data-d="1" aria-label="เพิ่ม">+</button></div></div>`;
  }).join("");
  document.getElementById("cartLines").innerHTML = lines || `<div class="empty">ยังไม่มีรายการในตะกร้า</div>`;
  const cb = billFor(cartTotal());
  const after = billFor((TABLE_STATE.total || 0) + cartTotal());
  document.getElementById("cartSum").innerHTML = sumRows(cb, "รวมตะกร้านี้") +
    (TABLE_STATE.total ? `<div class="r after"><span>ยอดทั้งโต๊ะหลังสั่ง (รวมที่สั่งไปแล้ว)</span><span class="price">${baht(after.total)}</span></div>` : "");
  const sb = document.getElementById("submitOrder");
  sb.disabled = !cartCount() || !TABLE_STATE.open;
  sb.textContent = TABLE_STATE.open ? "ยืนยันสั่งอาหาร" : "รอพนักงานเปิดโต๊ะก่อน";
  if (!cartCount()) closeSheet("cartSheet");
}

function renderOrders() {
  const list = TABLE_STATE.orders.slice().reverse();
  document.getElementById("ordersList").innerHTML = list.length ? list.map((o) => `
    <div class="order-card ${o.status}">
      <div class="head"><span>ออร์เดอร์ #${o.no} · สั่งเมื่อ ${new Date(o.createdAt).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" })} น.</span><span class="badge s-${o.status}">${STATUS[o.status]}</span></div>
      ${o.items.map((l) => `<div class="it"><span>${esc(l.name)} × ${l.qty}${l.done && o.status !== "cancelled" ? ` <span class="done-tag">✓ ได้แล้ว</span>` : ""}</span><span class="price">${baht(l.price * l.qty)}</span></div>`).join("")}
      ${o.note ? `<div class="note">หมายเหตุ: ${esc(o.note)}</div>` : ""}
    </div>`).join("") : `<div class="empty">ยังไม่ได้สั่งอะไร</div>`;
  document.getElementById("ordersSum").innerHTML = sumRows(TABLE_STATE.bill || billFor(TABLE_STATE.total), "ยอดที่ต้องจ่าย");
}

function openSheet(id) { document.getElementById(id).classList.add("open"); }
function closeSheet(id) { document.getElementById(id).classList.remove("open"); }

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.d) return setQty(b.dataset.id, (cart[b.dataset.id] || 0) + Number(b.dataset.d));
  if (b.dataset.cat) {
    document.querySelectorAll("nav.cats button").forEach((x) => x.classList.toggle("on", x === b));
    const sec = document.getElementById("cat-" + b.dataset.cat);
    if (sec) window.scrollTo({ top: sec.offsetTop - 64, behavior: "smooth" });
    return;
  }
  if (b.hasAttribute("data-close")) return b.closest(".sheet-bg").classList.remove("open");
  if (b.id === "openCart") { renderCart(); return openSheet("cartSheet"); }
  if (b.id === "openOrders") { renderOrders(); return openSheet("ordersSheet"); }
  if (b.id === "callStaff" || b.id === "callBill") {
    try {
      await api("/api/call", { table: TABLE, k: KEY, type: b.id === "callBill" ? "bill" : "staff" });
      toast(b.id === "callBill" ? "แจ้งเช็คบิลแล้ว รอพนักงานสักครู่" : "เรียกพนักงานแล้ว รอสักครู่");
      await refreshTable();
    } catch (err) { toast(err.message); }
    return;
  }
  if (b.id === "submitOrder") {
    b.disabled = true; b.textContent = "กำลังส่ง...";
    try {
      const items = Object.entries(cart).map(([id, qty]) => ({ id, qty }));
      const o = await api("/api/order", { table: TABLE, k: KEY, items, note: document.getElementById("note").value });
      cart = {}; saveCart(); document.getElementById("note").value = "";
      closeSheet("cartSheet");
      toast(`ส่งออร์เดอร์ #${o.no} แล้ว ครัวกำลังเตรียม`);
      await refreshTable();
    } catch (err) {
      toast(err.message);
      if (/หมด/.test(err.message)) await loadMenu();
      await refreshTable().catch(() => {});
    } finally { renderCart(); }
  }
});
document.querySelectorAll(".sheet-bg").forEach((bg) => bg.addEventListener("click", (e) => { if (e.target === bg) bg.classList.remove("open"); }));

async function loadMenu() { MENU = await api("/api/menu"); render(); }
async function refreshTable() {
  const wasOpen = TABLE_STATE.open, wasMoved = TABLE_STATE.movedTo;
  TABLE_STATE = await api(`/api/table/${TABLE}?k=${encodeURIComponent(KEY)}`);
  if (refreshTable.loaded && !wasOpen && TABLE_STATE.open) toast("เปิดโต๊ะแล้ว สั่งได้เลยจ้า");
  if (refreshTable.loaded && TABLE_STATE.movedTo && !wasMoved) { toast(`ย้ายไปโต๊ะ ${TABLE_STATE.movedTo} แล้ว`); window.scrollTo({ top: 0, behavior: "smooth" }); }
  refreshTable.loaded = true;
  render();
  if (document.getElementById("cartSheet").classList.contains("open")) renderCart();
  if (document.getElementById("ordersSheet").classList.contains("open")) renderOrders();
}

(async function start() {
  if (!TABLE) return blocker("📱", "กรุณาสแกน QR Code ที่โต๊ะ", "หน้านี้ใช้สั่งอาหารได้เมื่อสแกนจาก QR Code ที่ติดอยู่บนโต๊ะเท่านั้น");
  try {
    MENU = await api("/api/menu");
    document.title = MENU.shopName + " · โต๊ะ " + TABLE;
    document.querySelectorAll(".tno").forEach((x) => (x.textContent = TABLE));
    await refreshTable();
  } catch (err) { return blocker("⚠️", "เปิดเมนูไม่ได้", err.message); }

  // อัปเดตสถานะแบบ realtime (เช่น ครัวกดว่า "เสิร์ฟแล้ว" หรือเมนูหมด)
  const es = new EventSource(`/api/stream?table=${TABLE}&k=${encodeURIComponent(KEY)}`);
  let t; es.onmessage = () => { clearTimeout(t); t = setTimeout(async () => { try { MENU = await api("/api/menu"); await refreshTable(); } catch {} }, 150); };
})();
</script>
</body>
</html>
