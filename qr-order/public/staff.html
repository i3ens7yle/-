<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>หน้าจอพนักงาน</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.jpg">
<link rel="apple-touch-icon" href="/icon.jpg">
<style>
  .login { max-width: 340px; margin: 16vh auto 0; padding: 24px 16px; text-align: center; }
  .login input { width: 100%; font-size: 28px; text-align: center; letter-spacing: 8px; padding: 12px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); margin: 12px 0; }
  header.top {
    display: flex; flex-wrap: wrap; align-items: center; gap: 8px 16px; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--line); background: var(--card);
  }
  header.top h1 { margin: 0; font-size: 20px; }
  .brand { display: flex; align-items: center; gap: 12px; }
  .brand img { width: 52px; height: 52px; border-radius: 50%; flex: none; }
  .stat { color: var(--muted); font-size: 14px; }
  .stat b { color: var(--ink); font-size: 18px; }
  .tools { display: flex; gap: 8px; flex-wrap: wrap; }
  .tools .btn { min-height: 40px; padding: 8px 12px; font-size: 14px; }
  .tabs { display: flex; gap: 6px; padding: 12px 16px 0; overflow-x: auto; }
  .tabs button { border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 8px 16px; font-weight: 600; white-space: nowrap; min-height: 42px; }
  .tabs button.on { background: var(--ink); color: var(--bg); border-color: var(--ink); }
  .count { display: inline-block; min-width: 22px; padding: 0 6px; margin-left: 4px; border-radius: 999px; background: var(--bad); color: #fff; font-size: 13px; text-align: center; }
  main { padding: 12px 16px 40px; }

  .alerts { display: grid; gap: 8px; padding: 12px 16px 0; position: sticky; top: 0; z-index: 15; background: var(--bg); padding-bottom: 4px; }
  .alert.late { background: var(--bad); color: #fff; }
  .alert.late .btn { color: var(--ink); }
  .alert { display: flex; align-items: center; justify-content: space-between; gap: 10px; border-radius: 12px; padding: 10px 14px; font-weight: 600; animation: pulse 1.4s ease-in-out infinite; }
  .alert.staff { background: var(--warn-soft); color: var(--warn); }
  .alert.bill { background: var(--good-soft); color: var(--good); }
  .alert .btn { min-height: 38px; padding: 6px 12px; font-size: 14px; }
  @keyframes pulse { 50% { opacity: 0.75; } }

  .cols { display: grid; gap: 16px; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); align-items: start; }
  .col h2 { font-size: 16px; margin: 4px 0 10px; display: flex; align-items: center; gap: 8px; }
  .order { background: var(--card); border-radius: var(--radius); box-shadow: var(--shadow); padding: 12px 14px; margin-bottom: 10px; border-left: 5px solid var(--line); }
  .order.new { border-left-color: var(--bad); }
  .order.cooking { border-left-color: var(--warn); }
  .order.served { border-left-color: var(--good); opacity: 0.85; }
  .order .head { display: flex; justify-content: space-between; align-items: baseline; gap: 8px; }
  .order .tno { font-size: 20px; font-weight: 700; }
  .order .meta { color: var(--muted); font-size: 13px; }
  .order ul { margin: 8px 0; padding: 0; list-style: none; }
  .order li { display: flex; align-items: center; gap: 10px; font-size: 17px; padding: 4px 0; }
  .order li .q { font-weight: 700; min-width: 34px; color: var(--accent); }
  .order li .nm { flex: 1; min-width: 0; }
  .order li.done .nm, .order li.done .q { text-decoration: line-through; color: var(--muted); }
  .tick { flex: none; width: 38px; height: 38px; border-radius: 10px; border: 2px solid var(--line); background: var(--card); color: transparent; font-size: 22px; font-weight: 700; line-height: 1; padding: 0; }
  .tick.on { background: var(--good); border-color: var(--good); color: #fff; }
  .late-tag { flex: none; background: var(--bad); color: #fff; border-radius: 999px; padding: 2px 8px; font-size: 13px; font-weight: 700; }
  .order.late { box-shadow: 0 0 0 3px var(--bad), var(--shadow); }
  .order .when { font-size: 14px; color: var(--muted); margin-top: 2px; }
  .order .when b { color: var(--ink); }
  .order .note { background: var(--warn-soft); color: var(--warn); border-radius: 8px; padding: 6px 10px; font-weight: 600; margin: 6px 0; }
  .order .acts { display: flex; gap: 8px; margin-top: 8px; }
  .order .acts .btn { flex: 1; min-height: 44px; }
  .order .acts .btn-ghost { flex: 0 0 auto; }
  .empty { color: var(--muted); padding: 16px 4px; }

  .grid { display: grid; gap: 10px; grid-template-columns: repeat(auto-fill, minmax(130px, 1fr)); }
  .tile { background: var(--card); border: 2px solid var(--line); border-radius: var(--radius); padding: 12px; text-align: left; min-height: 104px; display: flex; flex-direction: column; gap: 2px; }
  .tile .n { font-size: 22px; font-weight: 700; }
  .tile .sub { font-size: 13px; color: var(--muted); }
  .tile .amt { font-weight: 700; font-size: 17px; margin-top: auto; }
  .tile.active { border-color: var(--accent); }
  .tile.pending { border-color: var(--bad); }
  .tile.call { border-color: var(--warn); background: var(--warn-soft); }
  .tile.empty-t { opacity: 0.6; }
  .tile.closed-t { opacity: 0.55; border-style: dashed; }
  .tile.open-t { border-color: var(--good); }
  .pick { display: grid; gap: 8px; grid-template-columns: repeat(auto-fill, minmax(92px, 1fr)); margin: 10px 0 14px; }
  .pick button { border: 2px solid var(--line); background: var(--card); border-radius: 12px; padding: 10px 6px; min-height: 64px; font-weight: 700; }
  .pick button small { display: block; font-weight: 400; color: var(--muted); font-size: 12px; }
  .pick button.busy { border-color: var(--accent); }
  .open-big { width: 100%; font-size: 20px; min-height: 60px; margin-top: 6px; }

  .menu-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; background: var(--card); border-radius: 12px; padding: 10px 14px; margin-bottom: 8px; }
  .menu-row.off { opacity: 0.6; }
  .switch { position: relative; width: 56px; height: 32px; border-radius: 999px; border: 0; background: var(--good); flex: none; }
  .switch::after { content: ""; position: absolute; top: 4px; left: 28px; width: 24px; height: 24px; border-radius: 50%; background: #fff; transition: left 0.15s; }
  .switch.off { background: var(--bad); }
  .switch.off::after { left: 4px; }

  .sum { width: 100%; border-collapse: collapse; margin-bottom: 8px; }
  .sum td { padding: 6px 0; border-bottom: 1px solid var(--line); }
  .sum td:last-child, .sum td:nth-child(2) { text-align: right; }
  .total-row { display: flex; justify-content: space-between; font-size: 22px; font-weight: 700; padding: 12px 0; }
  details { margin: 8px 0 14px; }
  details summary { cursor: pointer; color: var(--muted); }
</style>
</head>
<body>
<div id="app"></div>
<div class="toast" id="toast"></div>
<div class="sheet-bg" id="tableSheet"><div class="sheet" role="dialog" aria-modal="true" id="tableBody"></div></div>

<script>
const baht = (n) => "฿" + Number(n).toLocaleString("th-TH");
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
let clockOffset = 0; const now = () => Date.now() + clockOffset;
const mins = (ts) => Math.floor((now() - ts) / 60000);
const ago = (ts) => { const m = mins(ts); return m < 1 ? "เมื่อกี้" : m < 60 ? m + " นาทีที่แล้ว" : Math.floor(m / 60) + " ชม. " + (m % 60) + " นาที"; };
const hhmm = (ts) => new Date(ts).toLocaleTimeString("th-TH", { hour: "2-digit", minute: "2-digit" }) + " น.";
const STATUS = { new: "ใหม่", cooking: "กำลังทำ", served: "เสิร์ฟแล้ว", cancelled: "ยกเลิก" };

let PIN = ""; try { PIN = localStorage.getItem("staffPin") || ""; } catch {}
let tab = "orders"; try { tab = localStorage.getItem("staffTab") || "orders"; } catch {}
let sound = true; try { sound = localStorage.getItem("staffSound") !== "off"; } catch {}
let S = null, MENU = null, openTable = null, knownIds = null, es = null, audioCtx = null;
let snoozed = {}; try { snoozed = JSON.parse(localStorage.getItem("lateSnooze") || "{}") || {}; } catch {}
const alertedLate = new Set();
const SNOOZE_MIN = 5;
// เมนูที่รอเกินเวลา (ยังไม่ติ๊กว่าได้แล้ว)
function lateItems() {
  if (!S) return [];
  const limit = S.lateMinutes || 20, out = [];
  for (const o of S.orders) {
    if (o.status === "cancelled" || o.status === "served") continue;
    const m = mins(o.createdAt);
    if (m < limit) continue;
    o.items.forEach((l, idx) => { if (!l.done) out.push({ key: o.id + ":" + idx, o, l, idx, m }); });
  }
  return out;
}
const isSnoozed = (k) => snoozed[k] && snoozed[k] > now();
function checkLate() {
  const fresh = lateItems().filter((x) => !isSnoozed(x.key) && !alertedLate.has(x.key + ":" + (snoozed[x.key] || 0)));
  if (!fresh.length) return false;
  fresh.forEach((x) => alertedLate.add(x.key + ":" + (snoozed[x.key] || 0)));
  beep();
  const f = fresh[0];
  toast(`⏰ โต๊ะ ${f.o.table}: ${f.l.name} รอเกิน ${S.lateMinutes} นาทีแล้ว${fresh.length > 1 ? ` (+อีก ${fresh.length - 1} รายการ)` : ""}`);
  return true;
}

function toast(msg) {
  const t = document.getElementById("toast"); t.textContent = msg; t.classList.add("show");
  clearTimeout(toast.timer); toast.timer = setTimeout(() => t.classList.remove("show"), 2600);
}
async function api(path, body) {
  const r = await fetch(path, { method: body ? "POST" : "GET", headers: { "Content-Type": "application/json", "x-staff-pin": PIN }, body: body ? JSON.stringify(body) : undefined });
  const data = await r.json().catch(() => ({}));
  if (r.status === 401) { logout(); throw new Error("PIN ไม่ถูกต้อง"); }
  if (!r.ok) throw new Error(data.error || "เกิดข้อผิดพลาด");
  return data;
}
function beep() {
  if (!sound) return;
  try {
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    [0, 0.22, 0.44].forEach((d, i) => {
      const o = audioCtx.createOscillator(), g = audioCtx.createGain();
      o.frequency.value = i === 2 ? 1175 : 880; o.connect(g); g.connect(audioCtx.destination);
      const t = audioCtx.currentTime + d; g.gain.setValueAtTime(0.25, t); g.gain.exponentialRampToValueAtTime(0.001, t + 0.18);
      o.start(t); o.stop(t + 0.2);
    });
  } catch {}
}

function loginView(err) {
  document.getElementById("app").innerHTML = `
    <form class="login" id="loginForm">
      <h1 style="margin:0 0 4px">หน้าจอพนักงาน</h1>
      <p style="color:var(--muted);margin:0">ใส่ PIN ของร้าน</p>
      <input id="pin" type="password" inputmode="numeric" autocomplete="off" aria-label="PIN" autofocus>
      ${err ? `<p style="color:var(--bad);margin:0 0 10px">${esc(err)}</p>` : ""}
      <button class="btn btn-primary" style="width:100%">เข้าสู่ระบบ</button>
    </form>`;
  document.getElementById("loginForm").onsubmit = async (e) => {
    e.preventDefault();
    PIN = document.getElementById("pin").value.trim();
    try { audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)(); } catch {}
    try { await load(); try { localStorage.setItem("staffPin", PIN); } catch {} connect(); }
    catch (err) { loginView(err.message); }
  };
}
function logout() {
  PIN = ""; try { localStorage.removeItem("staffPin"); } catch {}
  if (es) es.close(); es = null; loginView();
}

async function load() {
  const [s, m] = await Promise.all([api("/api/staff/state"), api("/api/menu")]);
  const newIds = s.orders.filter((o) => o.status === "new").map((o) => o.id);
  const calls = s.tables.filter((t) => t.call).map((t) => t.table + t.call.type + t.call.at);
  if (knownIds && (newIds.some((id) => !knownIds.orders.has(id)) || calls.some((c) => !knownIds.calls.has(c)))) beep();
  knownIds = { orders: new Set(newIds), calls: new Set(calls) };
  clockOffset = s.now - Date.now();
  S = s; MENU = m;
  checkLate();
  render();
}
function connect() {
  if (es) es.close();
  es = new EventSource(`/api/stream?pin=${encodeURIComponent(PIN)}`);
  let t; es.onmessage = () => { clearTimeout(t); t = setTimeout(() => load().catch(() => {}), 120); };
  es.onopen = () => load().catch(() => {}); // โหลดใหม่หลังเน็ตหลุดแล้วต่อกลับ
}

function orderCard(o) {
  const acts = {
    new: `<button class="btn btn-primary" data-st="cooking" data-id="${o.id}">รับออร์เดอร์</button><button class="btn btn-ghost btn-danger" data-st="cancelled" data-id="${o.id}">ยกเลิก</button>`,
    cooking: `<button class="btn btn-good" data-st="served" data-id="${o.id}">เสิร์ฟแล้ว</button><button class="btn btn-ghost btn-danger" data-st="cancelled" data-id="${o.id}">ยกเลิก</button>`,
    served: `<button class="btn btn-ghost" data-st="cooking" data-id="${o.id}">↩ ย้อนกลับ</button>`,
  }[o.status] || "";
  const waited = mins(o.createdAt);
  const isLate = o.status !== "served" && o.status !== "cancelled" && waited >= (S.lateMinutes || 20);
  const doneAll = o.items.filter((l) => l.done).map((l) => l.doneAt || 0);
  const when = o.status === "served" && doneAll.length === o.items.length && doneAll.every(Boolean)
    ? `สั่ง <b>${hhmm(o.createdAt)}</b> · ได้ครบ <b>${hhmm(Math.max(...doneAll))}</b> (${Math.round((Math.max(...doneAll) - o.createdAt) / 60000)} นาที)`
    : `สั่ง <b>${hhmm(o.createdAt)}</b> · ${o.status === "served" || o.status === "cancelled" ? ago(o.createdAt) : `รอมา <b>${waited < 1 ? "ไม่ถึง 1" : waited}</b> นาที`}`;
  const canTick = o.status !== "cancelled";
  return `<div class="order ${o.status}${isLate ? " late" : ""}">
    <div class="head"><span class="tno">โต๊ะ ${o.table}</span><span class="meta">#${o.no}${o.movedFrom ? ` · ย้ายจากโต๊ะ ${o.movedFrom}` : ""}</span></div>
    <div class="when">🕒 ${when}</div>
    <ul>${o.items.map((l, i) => `<li class="${l.done ? "done" : ""}">${canTick ? `<button class="tick${l.done ? " on" : ""}" data-oid="${o.id}" data-item="${i}" data-done="${l.done ? "0" : "1"}" aria-pressed="${!!l.done}" aria-label="${l.done ? "ยกเลิกติ๊ก" : "ติ๊กว่าได้แล้ว"} ${esc(l.name)}">✓</button>` : ""}<span class="q">${l.qty}×</span><span class="nm">${esc(l.name)}</span>${isLate && !l.done ? `<span class="late-tag">⏰ ${waited} นาที</span>` : ""}</li>`).join("")}</ul>
    ${o.note ? `<div class="note">📝 ${esc(o.note)}</div>` : ""}
    <div class="acts">${acts}</div></div>`;
}

function render() {
  if (!S) return;
  const newCount = S.orders.filter((o) => o.status === "new").length;
  document.title = (newCount ? `(${newCount}) ` : "") + "หน้าจอพนักงาน · " + S.shopName;
  const calls = S.tables.filter((t) => t.call).sort((a, b) => a.call.at - b.call.at);
  const lates = lateItems().filter((x) => !isSnoozed(x.key));
  let body = "";
  if (tab === "orders") {
    const col = (st, title, list) => `<div class="col"><h2><span class="badge s-${st}">${title}</span> ${list.length}</h2>${list.map(orderCard).join("") || `<div class="empty">ไม่มี</div>`}</div>`;
    const by = (st) => S.orders.filter((o) => o.status === st);
    body = `<div class="cols">
      ${col("new", "ใหม่ รอรับ", by("new"))}
      ${col("cooking", "กำลังทำ", by("cooking"))}
      ${col("served", "เสิร์ฟแล้ว (ล่าสุด)", by("served").slice(-12).reverse())}
    </div>`;
  } else if (tab === "tables") {
    body = `<div class="grid">${S.tables.map((t) => {
      const cls = t.call ? "call" : t.pending ? "pending" : t.orders ? "active" : !t.open ? "closed-t" : S.requireOpenTable ? "open-t" : "empty-t";
      const sub = t.call ? (t.call.type === "bill" ? "💵 ขอเช็คบิล" : t.open ? "🔔 เรียกพนักงาน" : "🔔 เรียกให้เปิดโต๊ะ")
        : t.orders ? `${t.orders} ออร์เดอร์${t.pending ? ` · รอ ${t.pending}` : ""}<br>นั่งมา ${ago(t.since)}`
        : !t.open ? "🔒 ปิดอยู่" : S.requireOpenTable ? `เปิดแล้ว ยังไม่สั่ง<br>${ago(t.since)}` : "ว่าง";
      return `<button class="tile ${cls}" data-table="${t.table}"><span class="n">โต๊ะ ${t.table}</span><span class="sub">${sub}</span>${t.orders ? `<span class="amt price">${baht(t.total)}</span>` : ""}</button>`;
    }).join("")}</div>`;
  } else {
    body = `<p style="color:var(--muted);margin-top:0">กดปิดเมื่อของหมด ลูกค้าจะเห็นคำว่า "หมด" และสั่งไม่ได้ทันที</p>` +
      MENU.categories.map((c) => {
        const items = MENU.items.filter((i) => i.cat === c.id); if (!items.length) return "";
        return `<h3 style="margin:18px 0 8px">${esc(c.name)}</h3>` + items.map((i) => `
          <div class="menu-row${i.soldOut ? " off" : ""}"><span><b>${esc(i.name)}</b> <span class="price" style="color:var(--muted)">${baht(i.price)}</span>${i.soldOut ? ` <span class="badge s-new">หมด</span>` : ""}</span>
          <button class="switch${i.soldOut ? " off" : ""}" data-sold="${esc(i.id)}" aria-label="${i.soldOut ? "เปิดขาย" : "ปิด (หมด)"} ${esc(i.name)}" aria-pressed="${!i.soldOut}"></button></div>`).join("");
      }).join("");
  }
  document.getElementById("app").innerHTML = `
    <header class="top">
      <div class="brand">${MENU.logo ? `<img src="${esc(MENU.logo)}" alt="">` : ""}<div><h1>${esc(S.shopName)}</h1><div class="stat">ยอดปิดบิลวันนี้ <b class="price">${baht(S.today.sales)}</b> · ${S.today.bills} บิล</div></div></div>
      <div class="tools">
        <button class="btn" id="soundBtn">${sound ? "🔔 เสียงเปิด" : "🔕 เสียงปิด"}</button>
        <a class="btn" href="/qr" target="_blank" style="text-decoration:none;color:inherit;display:inline-flex;align-items:center">พิมพ์ QR โต๊ะ</a>
        <button class="btn btn-ghost" id="logoutBtn">ออก</button>
      </div>
    </header>
    ${calls.length || lates.length ? `<div class="alerts">${lates.map((x) => `
      <div class="alert late"><span>⏰ โต๊ะ ${x.o.table} · ${x.l.qty}× ${esc(x.l.name)} · สั่ง ${hhmm(x.o.createdAt)} รอมา ${x.m} นาที ได้หรือยัง?</span>
      <span style="display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end"><button class="btn" data-oid="${x.o.id}" data-item="${x.idx}" data-done="1">✓ ได้แล้ว</button><button class="btn" data-snooze="${x.key}">ยังไม่ได้ · เตือนอีก ${SNOOZE_MIN} นาที</button></span></div>`).join("")}${calls.map((t) => `
      <div class="alert ${t.call.type}"><span>${t.call.type === "bill" ? "💵" : "🔔"} โต๊ะ ${t.table} ${t.call.type === "bill" ? "ขอเช็คบิล" : "เรียกพนักงาน"} · ${ago(t.call.at)}</span>
      <span style="display:flex;gap:6px">${t.call.type === "bill" ? `<button class="btn" data-table="${t.table}">ดูบิล</button>` : ""}${t.open ? "" : `<button class="btn btn-good" data-opentable="${t.table}">เปิดโต๊ะ</button>`}<button class="btn" data-clear="${t.table}">รับทราบ</button></span></div>`).join("")}</div>` : ""}
    <div class="tabs">
      <button data-tab="orders" class="${tab === "orders" ? "on" : ""}">ออร์เดอร์${newCount ? `<span class="count">${newCount}</span>` : ""}</button>
      <button data-tab="tables" class="${tab === "tables" ? "on" : ""}">ดูตามโต๊ะ</button>
      <button data-tab="menu" class="${tab === "menu" ? "on" : ""}">เมนูหมด</button>
    </div>
    <main>${body}</main>`;
  if (openTable) renderTable(openTable);
}

function renderTable(n) {
  openTable = n;
  const orders = S.orders.filter((o) => o.table === n);
  const live = orders.filter((o) => o.status !== "cancelled");
  const sum = new Map();
  for (const o of live) for (const l of o.items) {
    const k = l.id + "@" + l.price; const r = sum.get(k) || { name: l.name, price: l.price, qty: 0 };
    r.qty += l.qty; sum.set(k, r);
  }
  const total = live.reduce((s, o) => s + o.total, 0);
  const t = S.tables.find((x) => x.table === n);
  if (t && !t.open) {
    document.getElementById("tableBody").innerHTML = `
      <h2><span>โต๊ะ ${n} <span class="stat">· ปิดอยู่</span></span><button class="close" data-closesheet aria-label="ปิด">×</button></h2>
      <p style="color:var(--muted);margin:0 0 12px">ลูกค้านั่งที่โต๊ะนี้แล้วใช่ไหม? กดเปิดโต๊ะ ลูกค้าถึงจะสแกน QR สั่งอาหารได้ พอปิดบิล โต๊ะจะปิดเองอัตโนมัติ</p>
      <button class="btn btn-good open-big" data-opentable="${n}">🔓 เปิดโต๊ะ ${n}</button>`;
    document.getElementById("tableSheet").classList.add("open");
    return;
  }
  document.getElementById("tableBody").innerHTML = `
    <h2><span>โต๊ะ ${n}${t && t.since ? ` <span class="stat">· เริ่ม ${hhmm(t.since)}</span>` : ""}</span><button class="close" data-closesheet aria-label="ปิด">×</button></h2>
    ${sum.size ? `<table class="sum"><tbody>${[...sum.values()].map((r) => `<tr><td>${esc(r.name)}</td><td>${r.qty} × ${baht(r.price)}</td><td class="price">${baht(r.qty * r.price)}</td></tr>`).join("")}</tbody></table>`
      : `<div class="empty">โต๊ะนี้ยังไม่มีรายการ</div>`}
    <div class="total-row"><span>ยอดรวม</span><span class="price">${baht(total)}</span></div>
    ${orders.length ? `<details><summary>ดูแยกทีละออร์เดอร์ (${orders.length})</summary>${orders.map((o) => `
      <div style="padding:8px 0;border-bottom:1px solid var(--line)"><div style="display:flex;justify-content:space-between"><b>#${o.no} · ${hhmm(o.createdAt)}</b><span class="badge s-${o.status}">${STATUS[o.status]}</span></div>
      ${o.items.map((l) => `${l.done ? "✓ " : ""}${esc(l.name)} × ${l.qty}`).join(", ")}${o.note ? `<div class="stat">📝 ${esc(o.note)}</div>` : ""}</div>`).join("")}</details>` : ""}
    <button class="btn" style="width:100%;margin-bottom:8px" data-movepick="${n}">↔️ ย้าย / รวมโต๊ะ</button>
    <button class="btn btn-good" style="width:100%;font-size:18px" data-closebill="${n}" ${orders.length || (t && (t.call || (S.requireOpenTable && t.open))) ? "" : "disabled"}>${orders.length ? "รับเงินแล้ว · ปิดบิล / ปิดโต๊ะ" : "ปิดโต๊ะ (ลูกค้ากลับแล้ว)"}</button>`;
  document.getElementById("tableSheet").classList.add("open");
}
function closeTableSheet() { openTable = null; document.getElementById("tableSheet").classList.remove("open"); }

document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  try {
    if (b.dataset.tab) { tab = b.dataset.tab; try { localStorage.setItem("staffTab", tab); } catch {} return render(); }
    if (b.id === "soundBtn") { sound = !sound; try { localStorage.setItem("staffSound", sound ? "on" : "off"); } catch {} if (sound) beep(); return render(); }
    if (b.id === "logoutBtn") return logout();
    if (b.dataset.table) return renderTable(Number(b.dataset.table));
    if (b.hasAttribute("data-closesheet")) return closeTableSheet();
    if (b.dataset.st) {
      if (b.dataset.st === "cancelled" && !confirm("ยกเลิกออร์เดอร์นี้?")) return;
      b.disabled = true;
      await api(`/api/staff/order/${b.dataset.id}/status`, { status: b.dataset.st });
      return load();
    }
    if (b.dataset.item != null && b.dataset.oid) {
      b.disabled = true;
      await api(`/api/staff/order/${b.dataset.oid}/item/${b.dataset.item}`, { done: b.dataset.done === "1" });
      return load();
    }
    if (b.dataset.snooze) {
      snoozed[b.dataset.snooze] = now() + SNOOZE_MIN * 60000;
      for (const k in snoozed) if (snoozed[k] < now() - 864e5) delete snoozed[k];
      try { localStorage.setItem("lateSnooze", JSON.stringify(snoozed)); } catch {}
      toast(`จะเตือนอีกครั้งใน ${SNOOZE_MIN} นาที`);
      return render();
    }
    if (b.dataset.opentable) {
      const n = Number(b.dataset.opentable);
      await api(`/api/staff/table/${n}/open`, {});
      toast(`เปิดโต๊ะ ${n} แล้ว ลูกค้าสั่งได้เลย`);
      if (openTable === n) openTable = null, document.getElementById("tableSheet").classList.remove("open");
      return load();
    }
    if (b.dataset.movepick) {
      const n = Number(b.dataset.movepick);
      document.getElementById("tableBody").innerHTML = `
        <h2><span>ย้ายโต๊ะ ${n} ไปที่โต๊ะ...</span><button class="close" data-closesheet aria-label="ปิด">×</button></h2>
        <p class="stat" style="margin:0">เลือกโต๊ะว่าง = ย้ายโต๊ะ · เลือกโต๊ะที่มีลูกค้า = รวมบิลเป็นโต๊ะเดียว</p>
        <div class="pick">${S.tables.filter((t) => t.table !== n).map((t) => {
          const busy = t.orders || (S.requireOpenTable && t.open);
          return `<button class="${busy ? "busy" : ""}" data-moveto="${t.table}" data-from="${n}">โต๊ะ ${t.table}<small>${busy ? "มีลูกค้า · รวม" : "ว่าง"}</small></button>`;
        }).join("")}</div>
        <button class="btn" style="width:100%" data-table="${n}">← กลับ</button>`;
      return;
    }
    if (b.dataset.moveto) {
      const from = Number(b.dataset.from), to = Number(b.dataset.moveto);
      const busy = b.classList.contains("busy");
      if (!confirm(busy ? `รวมโต๊ะ ${from} เข้ากับโต๊ะ ${to}?\nรายการทั้งหมดจะรวมเป็นบิลเดียวที่โต๊ะ ${to}` : `ย้ายลูกค้าโต๊ะ ${from} ไปโต๊ะ ${to}?\nรายการที่สั่งไว้จะย้ายไปด้วย`)) return;
      const r = await api(`/api/staff/table/${from}/move`, { to });
      closeTableSheet();
      toast(r.merged ? `รวมโต๊ะ ${from} เข้าโต๊ะ ${to} แล้ว` : `ย้ายโต๊ะ ${from} ไปโต๊ะ ${to} แล้ว`);
      return load();
    }
    if (b.dataset.clear) { await api(`/api/staff/call/${b.dataset.clear}/clear`, {}); return load(); }
    if (b.dataset.sold) {
      const item = MENU.items.find((i) => i.id === b.dataset.sold);
      await api("/api/staff/soldout", { id: item.id, soldOut: !item.soldOut });
      toast(item.soldOut ? `เปิดขาย "${item.name}" แล้ว` : `ปิด "${item.name}" (หมด) แล้ว`);
      return load();
    }
    if (b.dataset.closebill) {
      const n = Number(b.dataset.closebill);
      if (!confirm(`ยืนยันปิดโต๊ะ ${n}? รายการทั้งหมดจะถูกเคลียร์ และโต๊ะจะปิด รอเปิดให้ลูกค้าคนใหม่`)) return;
      const r = await api(`/api/staff/table/${n}/close`, {});
      closeTableSheet(); toast(`ปิดบิลโต๊ะ ${n} แล้ว ${baht(r.total)}`);
      return load();
    }
  } catch (err) { toast(err.message); b.disabled = false; }
});
document.getElementById("tableSheet").addEventListener("click", (e) => { if (e.target.id === "tableSheet") closeTableSheet(); });
// ทุก 15 วินาที: เช็คเมนูที่รอนานเกินกำหนด + อัปเดต "รอมากี่นาที"
let tickN = 0;
setInterval(() => {
  if (!S) return;
  const fired = checkLate();
  if (!openTable && (fired || ++tickN % 2 === 0)) render();
}, 15000);

(async () => {
  if (!PIN) return loginView();
  try { await load(); connect(); } catch (err) { loginView(err.message === "PIN ไม่ถูกต้อง" ? "" : err.message); }
})();
</script>
</body>
</html>
