<!doctype html>
<html lang="th">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>บันทึกรายจ่าย</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Noto+Sans+Thai:wght@400;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="/style.css">
<link rel="icon" href="/icon.jpg">
<style>
  .wrap { max-width: 760px; margin: 0 auto; padding: 0 16px 48px; }
  header.top { display: flex; align-items: center; gap: 12px; padding: 16px 0 8px; flex-wrap: wrap; }
  header.top img { width: 48px; height: 48px; border-radius: 50%; }
  header.top h1 { margin: 0; font-size: 22px; }
  header.top .links { margin-left: auto; display: flex; gap: 8px; flex-wrap: wrap; }
  header.top .links a { text-decoration: none; color: inherit; display: inline-flex; align-items: center; }
  .card { background: var(--card); border-radius: var(--radius); padding: 16px; box-shadow: var(--shadow); margin-top: 14px; }
  .card h2 { margin: 0 0 10px; font-size: 18px; }
  form .grid { display: grid; gap: 10px; grid-template-columns: 1fr 1fr; }
  form label { display: grid; gap: 4px; font-weight: 600; font-size: 14px; }
  form label.full { grid-column: 1 / -1; }
  form label small { font-weight: 400; color: var(--muted); }
  form input, form select { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 10px 12px; min-height: 46px; width: 100%; }
  form .amount { font-size: 20px; font-weight: 700; }
  .quick { display: flex; flex-wrap: wrap; gap: 6px; grid-column: 1 / -1; }
  .quick button { border: 1px solid var(--line); background: var(--bg); border-radius: 999px; padding: 6px 12px; font-size: 14px; min-height: 36px; }
  .month { display: flex; align-items: center; gap: 8px; justify-content: space-between; flex-wrap: wrap; }
  .month input { border: 1px solid var(--line); background: var(--bg); border-radius: 10px; padding: 8px 10px; min-height: 42px; }
  .total { font-size: 26px; font-weight: 700; font-variant-numeric: tabular-nums; }
  .cats { display: grid; gap: 4px; margin: 10px 0 4px; }
  .cats div { display: flex; justify-content: space-between; color: var(--muted); font-size: 14px; }
  .item { display: flex; gap: 10px; align-items: center; padding: 10px 0; border-bottom: 1px solid var(--line); }
  .item .d { flex: none; width: 62px; color: var(--muted); font-size: 13px; text-align: center; line-height: 1.2; }
  .item .d b { display: block; font-size: 20px; color: var(--ink); }
  .item .info { flex: 1; min-width: 0; }
  .item .cat { color: var(--muted); font-size: 13px; }
  .item .amt { font-weight: 700; font-variant-numeric: tabular-nums; white-space: nowrap; }
  .item .del { border: 0; background: transparent; color: var(--bad); font-size: 14px; padding: 8px; }
  .empty { color: var(--muted); text-align: center; padding: 20px 0; }
  @media (max-width: 520px) { form .grid { grid-template-columns: 1fr; } }
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <img src="/logo.jpg" alt="">
    <div><h1>บันทึกรายจ่าย</h1><div class="stat" style="color:var(--muted);font-size:14px">จดทุกครั้งที่จ่ายเงิน จะได้รู้กำไรจริง</div></div>
    <div class="links"><a class="btn" href="/report">📊 รายงาน</a><a class="btn" href="/staff">← หน้าจอพนักงาน</a></div>
  </header>

  <div class="card">
    <h2>เพิ่มรายจ่าย</h2>
    <form id="f" autocomplete="off">
      <div class="grid">
        <label>วันที่จ่าย<input type="date" name="date" required></label>
        <label>หมวด<select name="category" id="cat"></select></label>
        <div class="quick" id="quick"></div>
        <label class="full">รายการ<input name="desc" maxlength="120" placeholder="เช่น ซื้อเบียร์ 10 ลัง, ค่าแรงน้องเอ" required></label>
        <label>จำนวนเงิน (บาท)<input class="amount" name="amount" type="number" inputmode="decimal" min="0.01" step="0.01" required></label>
        <label>VAT ในบิลซื้อ <small>(ถ้ามีใบกำกับภาษี)</small><input name="vat" type="number" inputmode="decimal" min="0" step="0.01" placeholder="0"></label>
        <label class="full">หมายเหตุ <small>(ไม่ใส่ก็ได้)</small><input name="note" maxlength="120" placeholder="เช่น ร้านไหน, เลขที่ใบเสร็จ"></label>
      </div>
      <button class="btn btn-primary" style="width:100%;margin-top:12px;font-size:18px">บันทึกรายจ่าย</button>
    </form>
  </div>

  <div class="card">
    <div class="month"><h2 style="margin:0">รายจ่ายเดือน</h2><input type="month" id="month" aria-label="เลือกเดือน"></div>
    <div class="total" id="total"></div>
    <div class="cats" id="cats"></div>
    <div id="list"><div class="empty">กำลังโหลด...</div></div>
  </div>
</div>
<div class="toast" id="toast"></div>
<script>
const esc = (s) => String(s ?? "").replace(/[&<>"']/g, (c) => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const baht = (n) => "฿" + Number(n).toLocaleString("th-TH", { minimumFractionDigits: Number.isInteger(+n) ? 0 : 2, maximumFractionDigits: 2 });
const TH_MONTH = ["ม.ค.", "ก.พ.", "มี.ค.", "เม.ย.", "พ.ค.", "มิ.ย.", "ก.ค.", "ส.ค.", "ก.ย.", "ต.ค.", "พ.ย.", "ธ.ค."];
const QUICK = [["เบียร์ / เหล้า / เครื่องดื่ม", "ซื้อเบียร์"], ["น้ำแข็ง / แก๊ส", "ซื้อน้ำแข็ง"], ["วัตถุดิบอาหาร", "ซื้อของตลาด"], ["ค่าแรงพนักงาน", "ค่าแรงพนักงาน"], ["ค่าน้ำ / ค่าไฟ / เน็ต", "ค่าไฟ"], ["ค่าเช่าที่", "ค่าเช่าที่"]];
let PIN = ""; try { PIN = localStorage.getItem("staffPin") || ""; } catch {}
if (!PIN) location.href = "/staff";
let D = null;
function toast(m) { const t = document.getElementById("toast"); t.textContent = m; t.classList.add("show"); clearTimeout(toast.t); toast.t = setTimeout(() => t.classList.remove("show"), 2600); }
async function api(path, opt = {}) {
  const r = await fetch(path, { ...opt, headers: { "Content-Type": "application/json", "x-staff-pin": PIN } });
  const j = await r.json().catch(() => ({}));
  if (r.status === 401) { location.href = "/staff"; throw new Error("PIN"); }
  if (!r.ok) throw new Error(j.error || "เกิดข้อผิดพลาด");
  return j;
}
function lastDay(m) { const [y, mo] = m.split("-").map(Number); return new Date(Date.UTC(y, mo, 0)).toISOString().slice(0, 10); }
async function load() {
  const m = document.getElementById("month").value;
  D = await api(`/api/staff/expenses?from=${m}-01&to=${lastDay(m)}`);
  const f = document.getElementById("f");
  if (!f.date.value) f.date.value = D.today;
  const cat = document.getElementById("cat");
  if (!cat.options.length) {
    cat.innerHTML = D.categories.map((c) => `<option>${esc(c)}</option>`).join("");
    document.getElementById("quick").innerHTML = QUICK.map(([c, d]) => `<button type="button" data-c="${esc(c)}" data-d="${esc(d)}">${esc(d)}</button>`).join("");
  }
  render();
}
function render() {
  const list = D.expenses, sum = list.reduce((s, e) => s + e.amount, 0);
  const [y, mo] = document.getElementById("month").value.split("-").map(Number);
  document.getElementById("total").textContent = `${TH_MONTH[mo - 1]} ${y + 543} · ${baht(Math.round(sum * 100) / 100)}`;
  const byCat = {}; list.forEach((e) => (byCat[e.category] = (byCat[e.category] || 0) + e.amount));
  document.getElementById("cats").innerHTML = Object.entries(byCat).sort((a, b) => b[1] - a[1]).map(([c, v]) => `<div><span>${esc(c)}</span><span>${baht(Math.round(v * 100) / 100)}</span></div>`).join("");
  document.getElementById("list").innerHTML = list.length ? list.map((e) => {
    const d = new Date(e.date + "T00:00:00Z");
    return `<div class="item"><div class="d"><b>${d.getUTCDate()}</b>${TH_MONTH[d.getUTCMonth()]}</div>
      <div class="info"><div>${esc(e.desc)}</div><div class="cat">${esc(e.category)}${e.vat ? ` · VAT ${baht(e.vat)}` : ""}${e.note ? ` · ${esc(e.note)}` : ""}</div></div>
      <span class="amt">${baht(e.amount)}</span><button class="del" data-del="${e.id}" aria-label="ลบ ${esc(e.desc)}">ลบ</button></div>`;
  }).join("") : `<div class="empty">ยังไม่มีรายจ่ายในเดือนนี้</div>`;
}
document.getElementById("f").addEventListener("submit", async (ev) => {
  ev.preventDefault();
  const f = ev.target, btn = f.querySelector("button.btn-primary");
  btn.disabled = true;
  try {
    await api("/api/staff/expenses", { method: "POST", body: JSON.stringify({ date: f.date.value, category: f.category.value, desc: f.desc.value, amount: f.amount.value, vat: f.vat.value, note: f.note.value }) });
    toast(`บันทึกแล้ว ${baht(+f.amount.value)}`);
    f.desc.value = ""; f.amount.value = ""; f.vat.value = ""; f.note.value = "";
    const m = f.date.value.slice(0, 7);
    if (document.getElementById("month").value !== m) document.getElementById("month").value = m;
    await load(); f.desc.focus();
  } catch (e) { toast(e.message); } finally { btn.disabled = false; }
});
document.addEventListener("click", async (e) => {
  const b = e.target.closest("button"); if (!b) return;
  if (b.dataset.c) { const f = document.getElementById("f"); f.category.value = b.dataset.c; f.desc.value = b.dataset.d + " "; f.desc.focus(); return; }
  if (b.dataset.del) {
    const x = D.expenses.find((x) => x.id === b.dataset.del);
    if (!confirm(`ลบรายจ่าย "${x.desc}" ${baht(x.amount)}?`)) return;
    try { await api("/api/staff/expenses/" + b.dataset.del, { method: "DELETE" }); toast("ลบแล้ว"); await load(); } catch (err) { toast(err.message); }
  }
});
document.getElementById("month").addEventListener("change", load);
(async () => {
  const t = new Date().toLocaleDateString("en-CA", { timeZone: "Asia/Bangkok" });
  document.getElementById("month").value = t.slice(0, 7);
  try { await load(); } catch {}
})();
</script>
</body>
</html>
